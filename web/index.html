<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fingerspelling</title>
  </head>
  <body>
    <main>
      <div class="stage">
        <video id="webcam" playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <div id="tutor" data-phase="waiting">
        <div id="prompt">Sign this letter</div>
        <div id="target">A</div>
        <div id="bar"><div id="bar-fill"></div></div>
      </div>
      <div id="prediction">
        <span id="letter" class="unsure">–</span>
        <span id="confidence">loading…</span>
      </div>
      <div id="status">Starting…</div>
      <div><button id="skip">Skip</button></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
    <div id="scoreline">Score <span id="score">0</span> · Streak <span id="streak">0</span></div>
    <div id="grid"></div>
    <button id="reset">Reset stats</button>
  </body>
</html>
